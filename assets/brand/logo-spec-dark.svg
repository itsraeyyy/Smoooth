<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&amp;display=swap');
      .bg { fill: #0a0b0d; }
      .grid-line { stroke: #262b33; stroke-width: 1; stroke-dasharray: 4 4; }
      .safe-zone { stroke: #00f076; stroke-width: 1; stroke-dasharray: 2 2; fill: rgba(0, 240, 118, 0.03); }
      .safe-label { font-family: ui-monospace, monospace; font-size: 10px; fill: #00f076; }
      .mark-bg { fill: #121417; stroke: #383f4a; stroke-width: 1.5; rx: 12px; }
      .mark-accent { fill: #00f076; }
      .brand-text { font-family: 'Lexend', system-ui, sans-serif; font-size: 44px; font-weight: 700; fill: #f3f4f6; letter-spacing: -0.03em; }
      .badge-text { font-family: ui-monospace, monospace; font-size: 11px; fill: #c9f27a; letter-spacing: 0.05em; }
      .dim-line { stroke: #6b7280; stroke-width: 1; }
      .dim-text { font-family: ui-monospace, monospace; font-size: 9px; fill: #9ca3af; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="180" class="bg" rx="12" />

  <!-- Alignment Construction Grid -->
  <line x1="30" y1="90" x2="570" y2="90" class="grid-line" />
  <line x1="120" y1="20" x2="120" y2="160" class="grid-line" />

  <!-- Safe Zone Boundary -->
  <rect x="50" y="35" width="500" height="110" class="safe-zone" rx="6" />
  <text x="56" y="47" class="safe-label">1.0X CLEAR SPACE SAFE ZONE</text>

  <!-- Mark Container (64x64) -->
  <g transform="translate(75, 58)">
    <rect width="64" height="64" class="mark-bg" rx="12" />
    <!-- Placeholder Geometric Monogram Glyphs (S-Curve & VPS Terminal Pulse) -->
    <path d="M 18 22 C 18 17, 46 17, 46 25 C 46 32, 20 32, 20 41 C 20 48, 46 48, 46 43" fill="none" stroke="#c9f27a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="46" cy="43" r="3.5" class="mark-accent" />
    <circle cx="18" cy="22" r="2" fill="#f3f4f6" />
  </g>

  <!-- Wordmark 'Smoooth' in Lexend 700 -->
  <text x="160" y="104" class="brand-text">Smoooth</text>

  <!-- Spec Tag -->
  <rect x="368" y="74" width="76" height="20" fill="#181b20" stroke="#383f4a" rx="4" />
  <text x="375" y="88" class="badge-text">RUNTIME</text>

  <!-- Dimension Indicator -->
  <line x1="75" y1="130" x2="75" y2="140" class="dim-line" />
  <line x1="139" y1="130" x2="139" y2="140" class="dim-line" />
  <line x1="75" y1="135" x2="139" y2="135" class="dim-line" />
  <text x="107" y="146" class="dim-text">64px</text>

  <line x1="480" y1="60" x2="480" y2="120" class="dim-line" />
  <line x1="475" y1="60" x2="485" y2="60" class="dim-line" />
  <line x1="475" y1="120" x2="485" y2="120" class="dim-line" />
  <text x="510" y="93" class="dim-text">H: 60px</text>
</svg>
