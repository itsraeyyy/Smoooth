<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>404 — Page Not Found · Smoooth</title>
  <meta name="robots" content="noindex, follow"/>
  <link rel="icon" href="/favicon.ico"/>
  <style>
    body {
      background-color: #080C14;
      color: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 36px 28px;
      background: #0d121c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }
    .code {
      font-family: monospace;
      font-size: 13px;
      color: #73a3d2;
      background: rgba(0,0,0,0.4);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      border-radius: 9999px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">HTTP 404 // ROUTE_NOT_FOUND</div>
    <h1>The requested resource does not exist.</h1>
    <p>The page or endpoint you are looking for is not mapped in the Smoooth runtime router.</p>
    <a href="/" class="btn">&larr; Return to Smoooth Home</a>
  </div>
</body>
</html>
